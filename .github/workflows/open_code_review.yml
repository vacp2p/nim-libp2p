name: Open Code Review

on:
  issue_comment:
    types: [created]

# A newer authorized PR comment supersedes a review that is still running.
# Other comments get unique groups, so they cannot cancel a PR review.
concurrency:
  group: >-
    ${{
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["gmelodie","vladopajic","richard-ramos"]'), github.event.comment.user.login)
      && format('ocr-pr-{0}', github.event.issue.number)
      || format('ocr-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["gmelodie","richard-ramos","vladopajic"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve model and pull request refs
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const command = context.payload.comment.body.trim();
            const models = {
              pro: 'deepseek-v4-pro',
              flash: 'deepseek-flash',
              'deepseek-v4-pro': 'deepseek-v4-pro',
              'deepseek-flash': 'deepseek-flash',
            };
            let model = models.pro;
            if (command === '/review' || command.startsWith('/review ')) {
              const match = /^\/review(?: +([A-Za-z0-9-]+))?$/.exec(command);
              model = match && (match[1] ? models[match[1]] : models.pro);
              if (!model) {
                core.setFailed('Use /review [pro|flash|deepseek-v4-pro|deepseek-flash].');
                return;
              }
            }
            core.setOutput('model', model);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      # The action checks out the trusted base branch and fetches PR objects
      # without running code or reading review rules from the PR branch.
      - name: Review with DeepSeek
        uses: alibaba/open-code-review@66120291271b2e605e420e9f11fbd6448f06163f # v1.9.10
        with:
          ocr_version: '1.9.10'
          llm_url: https://api.deepseek.com/chat/completions
          llm_auth_token: ${{ secrets.DEEPSEEK_API_KEY }}
          llm_model: ${{ steps.pr.outputs.model }}
          llm_use_anthropic: 'false'
          rule: .opencodereview/rule.json
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
